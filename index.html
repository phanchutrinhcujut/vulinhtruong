<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Học Toán cùng Vui Làm Toán!</title>

  <!-- 1. Icon hiển thị trên tab trình duyệt (Logo VuiLamToan) -->
  <link rel="icon" type="https://i.postimg.cc/4dQvycKW/Gemini-Generated-Image-4rmpol4rmpol4rmp.png">
  <link rel="shortcut icon" type="https://i.postimg.cc/4dQvycKW/Gemini-Generated-Image-4rmpol4rmpol4rmp.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/tgqnyg3p/logo-pct.jpg">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vui Làm Toán">
  <meta name="application-name" content="Vui Làm Toán">
  <meta name="theme-color" content="#ffffff">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #ffffff;
    }
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      outline: none;
      display: block;
    }
    #loadingCover {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loadingCover">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.5px;">Đang kết nối phòng thi Toán THPT...</div>
  </div>

  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxf-cEV4zrTBbAM1AAaHsy3y6FXGNA0efRvtw_glmbJtLhbtASmfO6CW6LLAu0sumjDAA/exec" 
    allow="clipboard-write; fullscreen"
    onload="document.getElementById('loadingCover').style.opacity='0'; setTimeout(function(){ document.getElementById('loadingCover').style.display='none'; }, 400);">
  </iframe>

</body>
</html>
