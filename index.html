<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hệ Thống Luyện Thi Toán THPT</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    
    /* Hiển thị toàn màn hình chuẩn xác, giữ nguyên vẹn 100% thanh tiêu đề */
    #appFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }

    #loadingCover {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loadingCover">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.5px;">Đang kết nối phòng thi Toán THPT...</div>
  </div>

  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxf-cEV4zrTBbAM1AAaHsy3y6FXGNA0efRvtw_glmbJtLhbtASmfO6CW6LLAu0sumjDAA/exec" 
    allow="clipboard-write; fullscreen"
    onload="document.getElementById('loadingCover').style.opacity='0'; setTimeout(()=>document.getElementById('loadingCover').style.display='none', 400);">
  </iframe>

</body>
</html>
